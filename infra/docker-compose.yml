services:
  postgres:
    image: postgres:16-alpine
    container_name: costopt-postgres
    environment:
      POSTGRES_USER: costopt
      POSTGRES_PASSWORD: costopt
      POSTGRES_DB: costopt
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U costopt"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: costopt-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
